<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#000;--surf:#0a0a0a;--surf2:#141414;--line:#262626;--line2:#1a1a1a;--tx:#ededed;--mut:#a1a1a1;--acc:#fff}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:13px/1.45 Geist,Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:980px;margin:0 auto;padding:40px 24px;-webkit-font-smoothing:antialiased}
svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:7px;padding:0 10px;color:var(--mut)}.search input{background:none;border:0;outline:0;color:var(--tx);padding:7px 0;width:170px;font:inherit}.search:focus-within{border-color:var(--acc)}
.btn{display:flex;align-items:center;gap:6px;background:#ededed;color:#000;border:0;border-radius:7px;padding:7px 12px;font:500 13px inherit;cursor:pointer;font-family:inherit}.btn:hover{background:#fff}
.tabs{display:flex;gap:2px;align-items:center}.tab{padding:6px 11px;border-radius:6px;color:var(--mut);cursor:pointer;display:flex;gap:7px;align-items:center}.tab:hover{color:var(--tx)}.tab.on{background:var(--surf2);color:#fff}.tab i{font-style:normal;font-size:11px;color:var(--mut);background:#1f1f1f;padding:0 6px;border-radius:4px}
.sc{scrollbar-width:thin;scrollbar-color:#333 transparent;overflow-x:auto}.sc::-webkit-scrollbar{height:6px}.sc::-webkit-scrollbar-track{background:transparent;margin:0 14px}.sc::-webkit-scrollbar-thumb{background:#333;border-radius:99px}.sc::-webkit-scrollbar-thumb:hover{background:var(--acc)}.sc::-webkit-scrollbar-button{display:none}
.wrap{border:1px solid var(--line);border-radius:10px;background:var(--surf);overflow:hidden;box-shadow:none}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:880px}
th{font-weight:500;font-size:12px;color:var(--mut);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);white-space:nowrap;background:var(--surf);cursor:pointer}th span{display:flex;align-items:center;gap:7px}th:hover{color:var(--tx)}
td{padding:10px 12px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);white-space:nowrap;background:var(--surf);transition:background .12s}
th:last-child,td:last-child{border-right:0}
.st{position:sticky;left:0;z-index:2}.st2{position:sticky;left:44px;z-index:2;box-shadow:6px 0 10px -8px #000}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--surf2)}tr.f td{background:#111}tr.sel td{background:#161616}
.cb{width:15px;height:15px;border:1px solid #444;border-radius:4px;display:inline-grid;place-items:center;vertical-align:middle}.sel .cb,.cb.on{background:var(--acc);border-color:var(--acc)}.sel .cb:after,.cb.on:after{content:"";width:6px;height:3px;border:solid #000;border-width:0 0 1.5px 1.5px;transform:rotate(-45deg) translateY(-1px)}
.co{display:flex;align-items:center;gap:10px;font-weight:500}.lg{width:22px;height:22px;border-radius:5px;background-size:cover!important;box-shadow:0 0 0 1px #ffffff12}
.l0{background:url(https://www.google.com/s2/favicons?domain=openai.com&sz=64)}.l1{background:url(https://www.google.com/s2/favicons?domain=notion.so&sz=64)}.l2{background:url(https://www.google.com/s2/favicons?domain=linear.app&sz=64)}.l3{background:url(https://www.google.com/s2/favicons?domain=stripe.com&sz=64)}.l4{background:url(https://www.google.com/s2/favicons?domain=ramp.com&sz=64)}.l5{background:url(https://www.google.com/s2/favicons?domain=vercel.com&sz=64)}
.p0{background:url(https://randomuser.me/api/portraits/women/44.jpg)}.p1{background:url(https://randomuser.me/api/portraits/women/68.jpg)}.p2{background:url(https://randomuser.me/api/portraits/men/32.jpg)}.p3{background:url(https://randomuser.me/api/portraits/men/75.jpg)}.p4{background:url(https://randomuser.me/api/portraits/women/26.jpg)}.p5{background:url(https://randomuser.me/api/portraits/men/46.jpg)}
.ow{display:flex;align-items:center;gap:9px}.av{width:22px;height:22px;border-radius:50%;background-size:cover!important;box-shadow:0 0 0 1px #ffffff1a}
.t{display:inline-block;padding:2px 9px;border-radius:5px;font-size:12px;font-weight:500;margin-right:5px;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 62%,#e6eaf0)}
.num{text-align:right;font-variant-numeric:tabular-nums}.mut{color:var(--mut)}
.wp{display:flex;align-items:center;gap:10px;justify-content:flex-end}.seg{display:flex;gap:3px}.seg i{width:5px;height:14px;border-radius:2px;background:#2a2a2a}
.dt{display:flex;align-items:center;gap:7px;color:var(--tx)}.more{color:#666;text-align:center}.more:hover{color:#ddd}
tfoot td{color:var(--mut);border-bottom:0;background:#050505}tfoot b{color:var(--tx);font-weight:500}
.bulk{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);opacity:0;transition:.3s cubic-bezier(.2,.8,.2,1);background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;gap:2px;align-items:center;box-shadow:0 20px 50px #000a}.bulk.on{transform:translate(-50%,0);opacity:1}.bulk b{padding:0 10px;font-weight:500}
.bulk button,.x{background:none;border:0;color:var(--tx);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit;display:flex;gap:6px;align-items:center}.bulk button:hover,.x:hover{background:#1f1f1f}
.peek{position:fixed;top:12px;right:12px;bottom:12px;width:360px;background:var(--surf);border:1px solid var(--line);border-radius:10px;transform:translateX(110%);transition:.35s cubic-bezier(.2,.8,.2,1);padding:20px;box-shadow:0 30px 80px #000c}.peek.on{transform:none}
.peek h2{font-size:18px;margin:14px 0 8px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line2)}.row span:first-child{color:var(--mut);display:flex;gap:7px;align-items:center}
kbd{font:11px ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--mut)}.hint{margin-top:14px;color:#666;display:flex;gap:16px;justify-content:center}
</style></head><body>
<div class="top"><div class="tabs" id="tabs" style="margin:0"></div>
<label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search accounts"><kbd>/</kbd></label>
</div>
<div class="kpis" style="display:none">
<div class="k"><div class="l"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14"/></svg>Accounts</div><div class="v" id="k1"></div></div>
<div class="k"><div class="l"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Pipeline value</div><div class="v"><span id="k2"></span><span class="d">+12.4%</span></div></div>
<div class="k"><div class="l"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/></svg>Avg. win probability</div><div class="v" id="k3"></div></div>
<div class="k"><div class="l"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/></svg>Open deals</div><div class="v" id="k4"></div></div></div>
<div class="wrap"><div class="sc"><table><thead><tr>
<th class="st" style="width:44px"><span class="cb" id="all"></span></th>
<th class="st2" data-k="n"><span><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h.01M15 7h.01M9 11h.01M15 11h.01M10 21v-4h4v4"/></svg>Company</span></th>
<th><span><svg viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>Segment & Stage</span></th>
<th data-k="o"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5a6 6 0 0 1 11 0"/></svg>Account Owner</span></th>
<th data-k="d" class="num"><span style="justify-content:flex-end"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M3 13h18"/></svg>Open Deals</span></th>
<th data-k="v" class="num"><span style="justify-content:flex-end"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Deal Value</span></th>
<th data-k="w" class="num"><span style="justify-content:flex-end"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Win Probability</span></th>
<th><span><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity Trend</span></th>
<th data-k="li"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Last Interaction</span></th>
<th style="width:44px"></th></tr></thead><tbody id="tb"></tbody>
<tfoot><tr><td class="st"></td><td class="st2"><b id="fc"></b> companies in view</td><td></td><td></td><td class="num" id="fd"></td><td class="num" id="fv"></td><td class="num" id="fw"></td><td></td><td></td><td></td></tr></tfoot></table></div></div>
<div class="hint"><span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span><span><kbd>x</kbd> select</span><span><kbd>space</kbd> peek</span><span><kbd>/</kbd> search</span><span><kbd>esc</kbd> close</span></div>
<div class="bulk" id="bulk"><b id="bc"></b><button><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Assign</button><button><svg viewBox="0 0 24 24"><path d="M3 12V4h8l9 9-8 8z"/></svg>Stage</button><button><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 21h16"/></svg>Export</button><button onclick="clr()">✕</button></div>
<div class="peek" id="pk"></div>
<script>
const S={Strategic:'#e0707c',Enterprise:'#6b9ae8',Expansion:'#3fb5a5','Mid-Market':'#52b788',SMB:'#d9b95a',Renewal:'#a68ae0',Upsell:'#d77fad','New Logo':'#a4c25a'};
const D=[["OpenAI","Strategic","Expansion","Maya Chen",7,4200000,82,"Feb 22"],["Notion","Enterprise","Upsell","Elena Rossi",8,2400000,71,"Mar 4"],["Linear","Mid-Market","Renewal","Leo Hartman",3,820000,36,"Aug 8"],["Stripe","Enterprise","Expansion","Tom Okafor",6,3100000,68,"Jun 18"],["Ramp","Strategic","New Logo","Priya Raman",9,1900000,24,"Sep 2"],["Vercel","Mid-Market","Upsell","Sam Whitaker",4,960000,53,"Apr 16"]].map((r,i)=>({i,n:r[0],a:r[1],b:r[2],o:r[3],d:r[4],v:r[5],w:r[6],li:r[7],tr:Array.from({length:14},(_,j)=>30+Math.sin(j*.9+i*1.7)*12+j*(i%3)*1.4+((i*7+j*13)%9))}));
let f=0,sel=new Set,sk=null,dir=1,fil='All',q='';const $=id=>document.getElementById(id);
const money=v=>'$'+(v>=1e6?(v/1e6).toFixed(1)+'M':(v/1e3|0)+'K');
const wc=w=>w>=60?'#7fb96a':w>=40?'#d9b95a':'#d9895a';
const tag=t=>`<span class="t" style="--c:${S[t]}">${t}</span>`;
function spark(a){const mx=Math.max(...a),mn=Math.min(...a),p=a.map((y,x)=>[x*7,22-(y-mn)/(mx-mn)*18]);const d='M'+p.map(q=>q.join(',')).join('L');return `<svg viewBox="0 0 91 24" style="width:91px;height:24px;stroke:#52b788;stroke-width:1.5"><path d="${d}L91,24L0,24Z" fill="#52b78818" stroke="none"/><path d="${d}"/></svg>`}
const hist='<svg viewBox="0 0 24 24" style="color:#a1a1a1"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>';
function rows(){let r=D.filter(x=>(fil=='All'||x.a==fil)&&(x.n+x.o).toLowerCase().includes(q));if(sk)r.sort((a,b)=>(a[sk]>b[sk]?1:-1)*dir);return r}
function draw(){const r=rows();f=Math.max(0,Math.min(f,r.length-1));
$('tb').innerHTML=r.map((x,j)=>`<tr data-i="${x.i}" class="${j==f?'f':''} ${sel.has(x.i)?'sel':''}"><td class="st"><span class="cb"></span></td><td class="st2"><div class="co"><span class="lg l${x.i}"></span>${x.n}</div></td><td>${tag(x.a)}${tag(x.b)}</td><td><div class="ow"><span class="av p${x.i}"></span>${x.o}</div></td><td class="num">${x.d}</td><td class="num">${money(x.v)}</td><td><div class="wp">${x.w}%<span class="seg">${[0,1,2,3,4].map(k=>`<i style="${k<Math.round(x.w/20)?'background:'+wc(x.w):''}"></i>`).join('')}</span></div></td><td>${spark(x.tr)}</td><td><div class="dt">${hist}${x.li}</div></td><td class="more">···</td></tr>`).join('');
const n=r.length||1;$('fc').textContent=r.length;$('fd').innerHTML='<span class="mut">Sum</span> '+r.reduce((s,x)=>s+x.d,0);$('fv').innerHTML='<span class="mut">Sum</span> '+money(r.reduce((s,x)=>s+x.v,0));$('fw').innerHTML='<span class="mut">Avg</span> '+Math.round(r.reduce((s,x)=>s+x.w,0)/n)+'%';
$('bulk').classList.toggle('on',sel.size>0);$('bc').textContent=sel.size+' selected';$('all').classList.toggle('on',sel.size==D.length)}
$('k1').textContent=D.length;$('k2').textContent=money(D.reduce((s,x)=>s+x.v,0));$('k3').textContent=Math.round(D.reduce((s,x)=>s+x.w,0)/D.length)+'%';$('k4').textContent=D.reduce((s,x)=>s+x.d,0);
function tabs(){$('tabs').innerHTML=['All','Strategic','Enterprise','Mid-Market'].map(t=>`<span class="tab ${t==fil?'on':''}" data-t="${t}">${t}<i>${t=='All'?D.length:D.filter(x=>x.a==t).length}</i></span>`).join('')}
$('tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;fil=t.dataset.t;tabs();draw()};
function peek(x){$('pk').innerHTML=`<button class="x" onclick="$('pk').classList.remove('on')">✕ Close</button><div class="lg l${x.i}" style="width:48px;height:48px;border-radius:12px;margin-top:18px"></div><h2>${x.n}</h2><div style="margin-bottom:14px">${tag(x.a)}${tag(x.b)}</div><div class="row"><span>Owner</span><span class="ow"><span class="av p${x.i}"></span>${x.o}</span></div><div class="row"><span>Deal value</span><span>${money(x.v)}</span></div><div class="row"><span>Win probability</span><span style="color:${wc(x.w)}">${x.w}%</span></div><div class="row"><span>Open deals</span><span>${x.d}</span></div><div class="row"><span>Last interaction</span><span>${x.li}</span></div><div style="margin-top:18px">${spark(x.tr).replace('width:91px','width:100%').replace('height:24px','height:60px')}</div>`;$('pk').classList.add('on')}
$('tb').onclick=e=>{const tr=e.target.closest('tr');if(!tr)return;const i=+tr.dataset.i;f=[...tr.parentNode.children].indexOf(tr);if(e.target.closest('.cb')){sel.has(i)?sel.delete(i):sel.add(i)}else peek(D[i]);draw()};
$('all').onclick=()=>{sel.size==D.length?sel.clear():D.forEach(x=>sel.add(x.i));draw()};
document.querySelectorAll('th[data-k]').forEach(t=>t.onclick=()=>{dir=sk==t.dataset.k?-dir:1;sk=t.dataset.k;draw()});
$('q').oninput=e=>{q=e.target.value.toLowerCase();draw()};
function clr(){sel.clear();draw()}
onkeydown=e=>{if(e.target.tagName=='INPUT'){if(e.key=='Escape')e.target.blur();return}const r=rows();if(!r.length)return;
if(e.key=='/'){e.preventDefault();$('q').focus()}else if(e.key=='ArrowDown'||e.key=='j'){f=Math.min(f+1,r.length-1);draw()}else if(e.key=='ArrowUp'||e.key=='k'){f=Math.max(f-1,0);draw()}else if(e.key=='x'){const i=r[f].i;sel.has(i)?sel.delete(i):sel.add(i);draw()}else if(e.key==' '){e.preventDefault();peek(r[f])}else if(e.key=='Escape'){$('pk').classList.remove('on');clr()}};
tabs();draw();
</script></body></html>
