*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:#0c0d1a;font-family:Inter,system-ui,sans-serif;color:#fff}
#src{display:none}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.45)),linear-gradient(transparent 60%,rgba(0,0,0,.5))}
.logo{position:fixed;top:34px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px;font:400 34px 'Instrument Serif',Georgia,serif;letter-spacing:-.01em}.logo i{opacity:.7}
.wrap{position:fixed;inset:0;margin:auto;height:max-content;width:min(580px,90vw);display:grid;gap:12px}
.card{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06));backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:20px 22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 24px 60px rgba(0,0,0,.25)}
input{width:100%;background:none;border:0;outline:0;color:#fff;font:400 20px Inter,sans-serif}input::placeholder{color:rgba(255,255,255,.55)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:22px;color:rgba(255,255,255,.65);font-size:16px}.row span{display:flex;gap:8px;align-items:center}
.go{width:44px;height:44px;border-radius:50%;background:#ff6a3d;border:0;display:grid;place-items:center;cursor:pointer;transition:transform .2s}.go:hover{transform:translateY(-2px)}
.st{display:flex;justify-content:space-between;align-items:center;gap:12px}.st b{font-weight:400;font-size:17px;display:flex;align-items:center;gap:8px}.st small{display:block;margin-top:4px;color:rgba(255,255,255,.6);font:13px 'JetBrains Mono',monospace}
.pill{background:rgba(255,255,255,.16);padding:8px 14px;border-radius:99px;font:13px 'JetBrains Mono',monospace;white-space:nowrap}
.sp{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;display:none}.busy .sp{display:block}@keyframes r{to{transform:rotate(1turn)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chips button{background:rgba(0,0,0,.25);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:6px 12px;font:12px Inter;cursor:pointer;white-space:nowrap}
.foot{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.6)}

<div class="chips"><button>Classify dog breeds from photos</button><button>Detect rip currents in ocean waves</button><button>Avalanche risk model for alpine trails</button><button>Optimize desert solar farm routes</button><button>Count stars in telescope images</button><button>Segment trees from forest drone shots</button><button>Predict city traffic congestion</button></div></div><script>
const I={};document.querySelectorAll("#src img").forEach(i=>I[i.dataset.k]=i);
const L={ocean:"ocean sea wave surf beach coast tide marine fish rip current water boat",snow:"snow ice alpine avalanche mountain glacier winter ski cold peak trail",desert:"desert sand dune solar arid drought heat camel sahara noon",forest:"forest tree leaf plant wood drone canopy wildlife fire nature jungle",night:"star night galaxy telescope space astronomy moon orbit planet satellite dark",dog:"dog puppy breed pet cat animal canine vet bark",city:"city traffic urban street car building congestion transit taxi pedestrian"};
function intent(t){const w=t.toLowerCase().match(/[a-z]+/g)||[];let best="base",bs=0,hits=[];for(const k in L){const v=L[k].split(" ");let s=0;w.forEach(x=>{if(v.some(y=>x.startsWith(y)||y.startsWith(x)&&x.length>3)){s++;hits.push(x)}});if(s>bs){bs=s;best=k}}return{k:bs?best:"base",hits:[...new Set(hits)]}}
const c=document.getElementById("c"),x=c.getContext("2d"),o=document.createElement("canvas"),ox=o.getContext("2d");
let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight;go(cur,true)}
const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function cover(img,ctx,w,h){const r=Math.max(w/img.naturalWidth,h/img.naturalHeight),iw=img.naturalWidth*r,ih=img.naturalHeight*r;ctx.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih)}
let cur="base",anim=0;
function frame(img,px,dith){const w=Math.max(1,W/px|0),h=Math.max(1,H/px|0);o.width=w;o.height=h;cover(img,ox,w,h);
if(dith>0){try{const d=ox.getImageData(0,0,w,h),a=d.data,lv=Math.max(2,8-dith*6|0),st=255/(lv-1);for(let y=0;y<h;y++)for(let X=0;X<w;X++){const i=(y*w+X)*4,b=(B[(y&3)*4+(X&3)]/16-.5)*st;for(let ch=0;ch<3;ch++)a[i+ch]=Math.round((a[i+ch]+b)/st)*st}ox.putImageData(d,0,0)}catch(e){}}
x.imageSmoothingEnabled=px<=1;x.drawImage(o,0,0,W,H)}
function go(k,now){const img=I[k]&&I[k].naturalWidth?I[k]:I.base;if(!img.naturalWidth)return;cur=k;const id=++anim;
if(now){frame(img,1,0);return}const t0=performance.now(),D=1400;
(function step(t){if(id!==anim)return;const p=Math.min(1,(t-t0)/D);
const px=p<.5?Math.round(1+p*2*40):Math.round(1+(1-p)*2*40);
const show=p<.5?prev:img;frame(show,Math.max(1,px),p<1?1-Math.abs(p-.5)*1.4:0);if(p<1)requestAnimationFrame(step);else{prev=img;frame(img,1,0)}})(t0)}
let prev=I.base;onresize=rs;
Object.values(I).forEach(i=>i.onload=()=>{if(i===I[cur])go(cur,true)});rs();
const inp=document.getElementById("p"),sc=document.getElementById("sc"),T=document.getElementById("t"),J=document.getElementById("j"),K=document.getElementById("k");let tm;
function apply(){clearTimeout(tm);const r=intent(inp.value);sc.classList.remove("busy");
const N={ocean:"Open ocean",snow:"Alpine snow",desert:"Desert dunes",forest:"Deep forest",night:"Night sky",dog:"Good dog",city:"City lights",base:"Twilight"};T.textContent=r.k=="base"?"No clear setting — staying in twilight":"Setting the scene: "+N[r.k];J.textContent=r.hits.length?"Heard "+r.hits.map(h=>"“"+h+"”").join(" + "):"Try naming a place, season or subject";K.textContent=r.k;
if(r.k!==cur){if(!(I[r.k]&&I[r.k].naturalWidth))r.k="base";go(r.k)}}
inp.oninput=()=>{sc.classList.add("busy");T.textContent="Reading your prompt…";clearTimeout(tm);tm=setTimeout(apply,800)};
