<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f4f3f1;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,Helvetica,sans-serif}
.g{display:grid;grid-template-columns:1fr 1fr;width:min(1000px,96vw)}
.c{height:340px;display:grid;place-items:center;position:relative;cursor:pointer}
.c:nth-child(odd){border-right:1px solid #dcdbd8}.c:nth-child(-n+2){border-bottom:1px solid #dcdbd8}
.c p{position:absolute;bottom:26px;margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a8a6a2;transition:color .3s}
.c:hover p{color:#444}
.i{position:relative;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}.c:hover .i{transform:translateY(-6px)}
.t{width:168px;height:168px;border-radius:46px;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.3),0 22px 34px -16px rgba(0,0,0,.45)}
.t canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.t:before{content:"";position:absolute;inset:7px;border-radius:40px;border:1.5px solid rgba(255,255,255,.3);z-index:2}
.t:after{content:"";position:absolute;inset:0;border-radius:46px;background:linear-gradient(165deg,rgba(255,255,255,.28),transparent 40%),linear-gradient(0deg,rgba(0,0,0,.18),transparent 25%);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 4px rgba(0,0,0,.2);z-index:3}
.sh{position:absolute;left:12%;right:12%;bottom:-14px;height:24px;border-radius:50%;background:var(--s);filter:blur(14px);z-index:-1;opacity:.55;transition:.45s}
.c:hover .sh{opacity:.85;transform:scale(1.05)}
</style></head><body><div class="g">
<div class="c"><div class="i"><div class="t"><canvas width="56" height="56"></canvas></div><div class="sh" style="--s:#c2386a"></div></div><p>Wake</p></div>
<div class="c"><div class="i"><div class="t"><canvas width="56" height="56"></canvas></div><div class="sh" style="--s:#1f7a72"></div></div><p>Develop</p></div>
<div class="c"><div class="i"><div class="t"><canvas width="56" height="56"></canvas></div><div class="sh" style="--s:#2a6df0"></div></div><p>Signal</p></div>
<div class="c"><div class="i"><div class="t"><canvas width="56" height="56"></canvas></div><div class="sh" style="--s:#e0561b"></div></div><p>Ignite</p></div>
</div><script>
var B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(function(v){return (v+.5)/16});
function hx(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
var P=[["#1a1140","#3d1c6b","#8a2a7c","#e0476a","#ff8f4a","#ffd36b","#fff4c9"],
["#0c2a30","#145a5c","#23907f","#6fcfb0","#d9f2df","#f7f3e8"],
["#081537","#0f2d78","#1f5ae0","#4f9bff","#a9d8ff","#f0fbff"],
["#2a0a0e","#6b1416","#bd2f1a","#f06b1d","#ffb433","#ffe98a","#fffbe6"]].map(function(p){return p.map(hx)});
function cl(v){return v<0?0:v>1?1:v}
var F=[
function(x,y,t,h){var hz=38,sy=40-12*h,dx=x-28,dy=y-sy,d=Math.sqrt(dx*dx+dy*dy),r=8+h;
if(y<hz){if(d<r)return 1;var v=.08+.5*(y/hz)*(.6+.4*h)+.55*Math.exp(-d/(10+6*h))*(.5+.5*h);if(Math.abs(y-14+Math.sin(x/6+t)*1.5)<1.2&&x>8&&x<30)v+=.12;return cl(v)}
var k=y-hz,w=r*(1-k/20)+Math.sin(y*1.7+t*3)*1.5;if(Math.abs(dx)<w&&y%2==0)return .55+.3*h-k*.02;return .05+.12*(1-k/18)},
function(x,y,t,h){var fx0=11,fx1=45,fy0=8,fy1=48;var sx=(x-fx0),sy=(y-fy0);
if(x>=fx0+2&&x<=fx1+2&&y>=fy0+2&&y<=fy1+2&&!(x>=fx0&&x<=fx1&&y>=fy0&&y<=fy1))return .1;
if(x<fx0||x>fx1||y<fy0||y>fy1)return .32+.2*(y/56);
if(x<fx0+3||x>fx1-3||y<fy0+3||y>fy1-10)return 1;
var dev=.18+.82*h,v=.25+.5*(1-(y-11)/24),m=34-6*Math.abs(Math.sin((x-14)/5.5))-Math.max(0,8-Math.abs(x-30))*.6;
var sd=Math.hypot(x-36,y-17);if(sd<4)v=.95;if(y>m)v=.12+.06*Math.sin(x);
return cl(v*dev+(1-dev)*.08+(1-dev)*.05*Math.sin(t*4+y))},
function(x,y,t,h){var cx=28,cy=42,dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy),a=Math.atan2(dx,-dy);
var v=.1+.15*(1-y/56);if(d<3.2)return 1;if(Math.abs(a)<.85&&dy<0){var ph=(d-t*(4+14*h))/7;var f=ph-Math.floor(ph);var ring=f>.75?1:0;var fade=cl(1-d/(24+10*h));v+=ring*(.7+.3*h)*fade+.25*fade*(1-Math.abs(a));}
if(y>44&&Math.abs(dx)<1.5)v=.6;if(y>51&&Math.abs(dx)<8)v=.45;return cl(v)},
function(x,y,t,h){var nx=(x-28)/17,ny=(48-y)/(34+6*h);var fl=Math.sin(y*.45-t*(5+4*h))*(.08+.12*h)+Math.sin(y*.9+x*.3-t*7)*.05;
var e=1-ny*1.05-Math.abs(nx+fl*(1+ny*2))*(1.4-ny*.4);var v=.08+.1*(1-y/56);if(ny>0&&e>0)v=cl(.25+e*1.6);
if(y>48&&y<52&&Math.abs(x-28)<14)v=.2+((x+y)%3?0:.15);return v}];
var cs=[].slice.call(document.querySelectorAll('canvas')),H=cs.map(function(){return 0}),T=cs.map(function(){return 0});
cs.forEach(function(c,i){var p=c.closest('.c');p.onmouseenter=function(){T[i]=1};p.onmouseleave=function(){T[i]=0}});
var ctx=cs.map(function(c){return c.getContext('2d')}),img=ctx.map(function(x){return x.createImageData(56,56)});
function draw(ms){var t=ms/1000;cs.forEach(function(c,i){H[i]+=(T[i]-H[i])*(i==1?.03:.07);var pal=P[i],n=pal.length-1,d=img[i].data,f=F[i];
for(var y=0;y<56;y++)for(var x=0;x<56;x++){var v=f(x,y,t,H[i])*n,b=Math.floor(v);if(v-b>B[(y&3)*4+(x&3)])b++;if(b>n)b=n;var col=pal[b],o=(y*56+x)*4;d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255}
ctx[i].putImageData(img[i],0,0)});requestAnimationFrame(draw)}
requestAnimationFrame(draw);
</script></body></html>
