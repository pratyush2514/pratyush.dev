<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{background:radial-gradient(1200px 600px at 50% -10%,#1a1d26,#0b0c0f);color:#cfd3dc;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh;display:grid;place-items:center;padding:30px}

.kb{margin-left:auto;color:#4f5664;font-size:11px}.kb kbd{border:1px solid #2a2f39;border-bottom-width:2px;border-radius:4px;padding:0 5px;color:#8a91a0;margin:0 2px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#fff;color:#000;padding:8px 14px;border-radius:999px;font-size:12px;transition:.4s cubic-bezier(.2,.8,.2,1)}.toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body><div class="card">
<div class="hd"><span class="ic">TS</span><span class="p">src/lib/</span><span class="f">session.ts</span><span class="tag">modified</span>
<div class="st"><span class="a">+5</span><span class="r">−3</span><div class="sq"><i style="background:#5ee0a0"></i><i style="background:#5ee0a0"></i><i style="background:#5ee0a0"></i><i style="background:#ff7a8a"></i><i style="background:#ff7a8a"></i></div><button class="ib" id="cp">Copy</button></div></div>

<div class="ft"><div class="seg" id="seg"><div class="pill"></div><button data-v="0">Before</button><button data-v="50">Diff</button><button data-v="100">After</button></div><button class="ib" id="pl">▶ Replay</button>
<span class="kb"><kbd>←</kbd><kbd>→</kbd> scrub <kbd>R</kbd> replay <kbd>J</kbd><kbd>K</kbd> jump to change</span></div>
</div><div class="toast" id="toast"></div><script>

const b=document.getElementById('b'),mm=document.getElementById('mm');let o=0,n=0;const rows=[];
const fold=document.createElement('div');fold.className='fold';fold.innerHTML='<span>⋯</span><span>Expand 4 unchanged lines</span>';
L.forEach(([t,c],i)=>{const d=document.createElement('div');d.className='ln'+(t<0?' del':t>0?' add':'')+(i<4?' hidden fl':'');

d.dataset.t=t;if(i==4)b.appendChild(fold);b.appendChild(d);rows.push(d);
