<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Code · Permission</title>
<style>
:root{
  --ink:#f1eee8; --ink2:#a39f97; --ink3:#6b6862;
  --line:rgba(255,255,255,.08); --surf:#131312;
  --acc:#d97757; --danger:#e8695e; --add:#8fc79a; --del:#e8837a;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0c0c0b;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--ink3);outline-offset:2px}

/* controls outside the device */
.tabs{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;background:#141413;border:1px solid var(--line);border-radius:11px;z-index:5}
.tabs button{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 11px;border-radius:8px;color:var(--ink3);transition:color .15s,background .15s}
.tabs button:hover{color:var(--ink2)}
.tabs button.on{background:#232321;color:var(--ink)}
.hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink3);z-index:5}
.hint kbd{font:10px var(--mono);color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin:0 1px}

/* device */
.stage{display:flex;flex-direction:column;align-items:center;transform-origin:center}
.band{width:172px;height:130px;position:relative;background:linear-gradient(90deg,#121212,#1d1d1d 30%,#202020 50%,#191919 70%,#101010)}
.band:before{content:"";position:absolute;inset:0 14px;border-left:1px solid rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.04)}
.band.t{border-radius:28px 28px 4px 4px;margin-bottom:-26px;-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
.band.b{border-radius:4px 4px 28px 28px;margin-top:-26px;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.band.b i{position:absolute;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#050505;box-shadow:inset 0 1px 1px #000}
.case{position:relative;z-index:2;width:292px;height:352px;border-radius:80px;padding:5px;background:linear-gradient(150deg,#77777b,#37373a 24%,#1c1c1d 52%,#3d3d40 82%,#85858a);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 -2px 3px rgba(0,0,0,.5)}
.bez{width:100%;height:100%;border-radius:75px;background:#000;padding:10px;box-shadow:inset 0 0 0 1.5px #232325}
.crown{position:absolute;right:-13px;top:96px;width:16px;height:52px;border-radius:5px 7px 7px 5px;background:repeating-linear-gradient(0deg,#8f8f95 0 1.5px,#47474b 1.5px 3px);box-shadow:inset -2px 0 3px rgba(0,0,0,.45),0 0 0 1px #000;cursor:pointer}
.act{position:absolute;right:-6px;top:182px;width:8px;height:62px;border-radius:3px;background:#c4694a;box-shadow:inset -1px 0 2px rgba(0,0,0,.35),0 0 0 1px #000;cursor:pointer}
.scr{position:relative;width:100%;height:100%;border-radius:65px;background:#000;overflow:hidden}
.scr:after{content:"";position:absolute;inset:0;border-radius:65px;background:linear-gradient(125deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.015) 28%,transparent 29%);pointer-events:none;z-index:9}

/* screen */
.ui{position:absolute;inset:0;display:flex;flex-direction:column;padding:21px 19px 22px}
.top{flex:none;display:flex;align-items:center;gap:6px;height:16px;padding:0 6px;font-size:10.5px;color:var(--ink3)}
.spark{width:14px;height:14px;flex:none;fill:var(--acc);transform-origin:50% 50%}
.spark.turn{animation:settle .55s cubic-bezier(.2,.7,.2,1)}
@keyframes settle{from{transform:rotate(-50deg) scale(.7);opacity:.3}to{transform:none;opacity:1}}
.brand{flex:1;letter-spacing:.01em}
.count{font:10px var(--mono);font-variant-numeric:tabular-nums}
#main{flex:1;min-height:0;margin-top:8px;display:flex;flex-direction:column}
#main.out{opacity:0;transition:opacity .12s linear}
#main>*{flex:1;min-height:0}
.enter>*{animation:rise .3s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.ask{display:flex;flex-direction:column;gap:8px}
.head{flex:none;display:flex;align-items:center;gap:9px}
.tile{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.06);display:grid;place-items:center}
.danger .tile{background:rgba(232,105,94,.14);color:var(--danger)}
h1{font:400 15.5px/1.15 var(--serif);letter-spacing:-.005em}
.head p{font-size:10.5px;color:var(--ink3);margin-top:2px}
.danger .head p{color:var(--danger);opacity:.85}

.card{flex:1;min-height:0;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:9px 10px;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.card.flush{padding:0;gap:0}
.mono{font-family:var(--mono)}
.cmd{font-size:11px;line-height:1.5;word-break:break-all}
.cmd .p{color:var(--ink3);margin-right:6px;user-select:none}
.note{font-size:10.5px;line-height:1.35;color:var(--ink2)}
.meta{margin-top:auto;font:10px var(--mono);color:var(--ink3)}
.danger .meta{color:var(--danger)}

.file{flex:none;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font:10.5px var(--mono);color:var(--ink2)}
.file span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file b{font-weight:500}.file .a{color:var(--add)}.file .d{color:var(--del)}
.diff{flex:1;padding:5px 0;font:10px var(--mono)}
.dl{display:grid;grid-template-columns:24px 14px 1fr;height:16px;line-height:16px;white-space:pre;overflow:hidden;color:var(--ink2)}
.dl .ln{text-align:right;padding-right:5px;color:var(--ink3)}
.dl .sg{text-align:center}
.dl.add{background:rgba(143,199,154,.12);color:var(--ink)}.dl.add .sg{color:var(--add)}
.dl.del{background:rgba(232,131,122,.12);color:var(--ink)}.dl.del .sg{color:var(--del)}

.host{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;letter-spacing:-.005em}
.host svg{color:var(--ink3)}
.route{font:10.5px var(--mono);color:var(--ink2)}
.route i{font-style:normal;color:var(--ink3);margin-right:6px}
.list{display:flex;flex-direction:column;margin-top:2px}
.list div{display:flex;justify-content:space-between;height:18px;line-height:18px;font:10.5px var(--mono)}
.list em{font-style:normal;color:var(--ink3)}

.opts{flex:none;list-style:none;display:flex;flex-direction:column;gap:2px}
.opt{position:relative;height:28px;border-radius:8px;display:grid;grid-template-columns:10px 14px 1fr auto;align-items:center;gap:6px;padding:0 9px 0 7px;font-size:12px;color:var(--ink2);cursor:pointer;overflow:hidden;transition:background .14s,color .14s;touch-action:none;user-select:none}
.opt:before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:rgba(232,105,94,.26);transition:width .2s var(--ease)}
.opt.holding:before{transition:none}
.opt>*{position:relative}
.opt.sel{background:rgba(255,255,255,.075);color:var(--ink)}
.caret{display:grid;color:var(--acc);opacity:0;transform:translateX(-3px);transition:opacity .14s,transform .14s var(--ease)}
.sel .caret{opacity:1;transform:none}
.k{font:10px var(--mono);color:var(--ink3)}
.l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hold{font:9px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}

.done{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.mark{width:46px;height:46px;margin-bottom:4px}
.mark .ring{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1.5}
.mark .g{fill:none;stroke:var(--ink);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mark .g.draw{stroke-dasharray:32;stroke-dashoffset:32;animation:draw .42s .12s cubic-bezier(.5,0,.2,1) forwards}
.mark .arc{transform-origin:23px 23px;animation:turn .9s linear infinite}
.big{width:44px;height:44px;margin-bottom:8px;fill:var(--acc);animation:turn 9s linear infinite}
.big .br{transform-origin:50px 50px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.9)}}
.verb{font:400 16px/1.15 var(--serif);min-height:18px;color:transparent;background:linear-gradient(90deg,var(--acc) 0 40%,#f1b49b 50%,var(--acc) 60% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;animation:shim 1.7s linear infinite}
.verb.swap{animation:shim 1.7s linear infinite,vin .26s cubic-bezier(.2,.7,.2,1)}
@keyframes shim{from{background-position:100% 0}to{background-position:-60% 0}}
@keyframes vin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.rmeta{font:10px var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums;margin-bottom:8px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes turn{to{transform:rotate(360deg)}}
h2{font:400 17px/1.1 var(--serif)}
.sub{font-size:10.5px;color:var(--ink3);margin-bottom:6px}
.log{align-self:stretch;text-align:left;padding:8px 10px;border-radius:10px;background:var(--surf);border:1px solid var(--line);font:10.5px/1.65 var(--mono);color:var(--ink2)}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .dot{color:var(--ink)}.log .ok{color:var(--add)}.log .no{color:var(--del)}
.log .r{color:var(--ink3)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>

const svg=(p,s=16,w=1.75)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={
  bash:'<path d="M4 17l6-6-6-6"/><path d="M12 19h8"/>',

};

const dl=(n,t,c)=>`<div class="dl ${t==='+'?'add':t==='-'?'del':''}"><span class="ln">${n}</span><span class="sg">${t===' '?'':t==='-'?'−':t}</span><span class="cd">${c}</span></div>`;

const Q=[
 {k:'bash',tab:'Command',icon:'bash',title:'Run this command?',tool:'Bash',
  card:`<div class="cmd mono"><span class="p">$</span>npm test -- --coverage</div><div class="note">Run the test suite with coverage</div><div class="meta">~/acme-web</div>`,
  opts:['Yes',"Yes, and don't ask again",'No, tell Claude what to do'],acts:['y','a','n'],

  card:`<div class="file"><span>src/auth/session.ts</span><span><b class="a">+2</b> <b class="d">−1</b></span></div><div class="diff">${dl(11,' ','export function open() {')}${dl(12,'-','  const ttl = 3600')}${dl(12,'+','  const ttl = 86400')}${dl(13,'+','  const renew = true')}</div>`,
  opts:['Yes','Yes, allow all edits','No, tell Claude what to do'],acts:['y','a','n'],
  log:'Update(src/auth/session.ts)',run:'Applying edit',res:'Updated with 2 additions and 1 removal'},

  card:`<div class="host">${svg(IC.lock,12,2)}docs.stripe.com</div><div class="route"><i>GET</i>/api/charges</div><div class="note">Read the API reference to match the response shape</div><div class="meta">https · public page</div>`,

  opts:['Yes','No, tell Claude what to do'],acts:['y','n'],
  log:'Bash(rm -rf dist node_modules .next)',run:'Removing files',res:'Removed 3 folders · 412 MB'}

const $=s=>document.querySelector(s);
const main=$('#main'),spark=$('#spark'),count=$('#count'),tabs=$('#tabs'),stage=$('#stage');
const V=['Accomplishing', 'Baking', 'Brewing', 'Cerebrating', 'Churning', 'Cogitating', 'Combobulating', 'Concocting', 'Conjuring', 'Crafting', 'Crunching', 'Deciphering', 'Elucidating', 'Finagling', 'Forging', 'Germinating', 'Hatching', 'Incubating', 'Manifesting', 'Marinating', 'Mulling', 'Musing', 'Noodling', 'Percolating', 'Pondering', 'Puzzling', 'Reticulating', 'Ruminating', 'Simmering', 'Spelunking', 'Synthesizing', 'Tinkering', 'Transmuting', 'Unfurling', 'Whirring', 'Wrangling'];
let idx=0,sel=0,busy=false,timers=[],holdRaf=0,holdRow=null,verbT=null,tickT=null;

const later=(ms,f)=>{timers.push(setTimeout(f,ms))};
function clearAll(){timers.forEach(clearTimeout);timers=[];stopHold();stopRun()}
function stopRun(){clearInterval(verbT);clearInterval(tickT)}
function startRun(){
  stopRun();const t0=performance.now(),vb=main.querySelector('.verb'),mt=main.querySelector('.rmeta');if(!vb)return;
  let last=-1,tok=0;
  const pick=()=>{let i;do{i=Math.random()*V.length|0}while(i===last);last=i;vb.textContent=V[i]+'\u2026';vb.classList.remove('swap');void vb.offsetWidth;vb.classList.add('swap')};
  const upd=()=>{tok+=Math.round(14+Math.random()*34);mt.textContent=Math.floor((performance.now()-t0)/1000)+'s \u00b7 \u2193 '+tok+' tokens'};
  pick();upd();verbT=setInterval(pick,1000);tickT=setInterval(upd,240);
}
function settle(){spark.classList.remove('turn');void spark.getBoundingClientRect();spark.classList.add('turn')}

function show(html,instant,cb){
  const put=()=>{main.classList.remove('out');main.innerHTML=html;main.firstElementChild.classList.add('enter');if(cb)cb()};
  if(instant){put()}else{main.classList.add('out');later(120,put)}
}

/* tabs */
tabs.innerHTML=Q.map((q,i)=>`<button data-i="${i}">${svg(IC[q.icon],13,1.9)}${q.tab}</button>`).join('');
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;clearAll();idx=+b.dataset.i;ask(true)});

/* ask */
const isHold=i=>Q[idx].hold&&Q[idx].acts[i]==='y';
const rows=()=>main.querySelectorAll('.opt');
function ask(instant){
  const q=Q[idx];busy=false;sel=0;stopRun();settle();
  count.textContent=`${idx+1} / ${Q.length}`;
  [...tabs.children].forEach((b,i)=>b.classList.toggle('on',i===idx));
  const opts=q.opts.map((l,i)=>`<li class="opt${i===0?' sel':''}" role="option" aria-selected="${i===0}" data-i="${i}"><span class="caret">${svg(IC.chev,10,2.4)}</span><span class="k">${i+1}</span><span class="l">${l}</span>${q.hold&&q.acts[i]==='y'?'<span class="hold">hold</span>':''}</li>`).join('');
  show(`<section class="ask${q.danger?' danger':''}"><div class="head"><div class="tile">${svg(IC[q.icon],16)}</div><div><h1>${q.title}</h1><p>${q.tool}</p></div></div><div class="card${q.flush?' flush':''}">${q.card}</div><ul class="opts" role="listbox">${opts}</ul></section>`,instant);
}
function setSel(i){sel=i;rows().forEach((r,j)=>{r.classList.toggle('sel',j===i);r.setAttribute('aria-selected',j===i)})}

/* result */
const mark=inner=>`<svg class="mark" viewBox="0 0 46 46" aria-hidden="true"><circle class="ring" cx="23" cy="23" r="22"/>${inner}</svg>`;
function result(kind,a){
  const q=Q[idx];
  if(kind==='running'){
    show(`<section class="done"><svg class="big" viewBox="0 0 100 100" aria-hidden="true"><g class="br"><use href="#cc"/></g></svg><div class="verb" aria-live="off"></div><div class="rmeta"></div><div class="log"><div><span class="dot">⏺</span> ${q.log}</div><div class="r">⎿&nbsp; Running…</div></div></section>`,false,startRun);
  }else if(kind==='done'){
    stopRun();
    show(`<section class="done">${mark('<path class="g draw" d="M15 24l6 6 11-12"/>')}<h2>Allowed</h2><div class="sub">${a==='a'?'Remembered for this session':'One-time approval'}</div><div class="log"><div><span class="ok">⏺</span> ${q.log}</div><div class="r">⎿&nbsp; ${q.res}</div></div></section>`);
  }else{
    stopRun();
    show(`<section class="done">${mark('<path class="g draw" d="M17 17l12 12M29 17L17 29"/>')}<h2>Denied</h2><div class="sub">Claude will ask what to do instead</div><div class="log"><div><span class="no">⏺</span> ${q.log}</div><div class="r">⎿&nbsp; Not run</div></div></section>`);
  }
}
function answer(a){
  if(busy)return;busy=true;stopHold();
  if(a==='n'){result('denied');later(2100,next)}
  else{result('running');later(3000,()=>result('done',a));later(5100,next)}
}
function next(){idx=(idx+1)%Q.length;ask()}
const choose=i=>answer(Q[idx].acts[i]);

/* hold-to-confirm (destructive) */
function startHold(row){
  if(holdRaf||!row)return;holdRow=row;row.classList.add('holding');
  const t0=performance.now();
  const f=t=>{const p=Math.max(0,Math.min((t-t0)/900,1));row.style.setProperty('--p',p*100+'%');
    if(p<1)holdRaf=requestAnimationFrame(f);else{holdRaf=0;holdRow=null;answer('y')}};
  holdRaf=requestAnimationFrame(f);
}
function stopHold(){
  if(holdRaf){cancelAnimationFrame(holdRaf);holdRaf=0}
  if(holdRow){holdRow.classList.remove('holding');holdRow.style.setProperty('--p','0%');holdRow=null}
}

/* input */
main.addEventListener('pointerover',e=>{const r=e.target.closest('.opt');if(r&&!busy)setSel(+r.dataset.i)});
main.addEventListener('pointerdown',e=>{const r=e.target.closest('.opt');if(!r||busy)return;const i=+r.dataset.i;setSel(i);if(isHold(i))startHold(r)});
main.addEventListener('click',e=>{const r=e.target.closest('.opt');if(!r||busy)return;const i=+r.dataset.i;if(!isHold(i))choose(i)});
addEventListener('pointerup',()=>stopHold());
addEventListener('pointercancel',()=>stopHold());

addEventListener('keydown',e=>{
  if(busy||e.metaKey||e.ctrlKey)return;
  const n=Q[idx].opts.length;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();setSel((sel+(e.key==='ArrowDown'?1:n-1))%n)}
  else if(e.key==='Enter'){if(e.repeat)return;e.preventDefault();isHold(sel)?startHold(rows()[sel]):choose(sel)}
  else if(e.key==='Escape'){answer('n')}
  else if(/^[1-9]$/.test(e.key)&&+e.key<=n){setSel(+e.key-1);if(!isHold(sel))choose(sel)}
});
addEventListener('keyup',e=>{if(e.key==='Enter')stopHold()});

/* crown + side button */
let wl=0;
$('#case').addEventListener('wheel',e=>{
  e.preventDefault();
  if(busy||Math.abs(e.deltaY)<4||Date.now()-wl<90)return;wl=Date.now();
  setSel(Math.max(0,Math.min(Q[idx].opts.length-1,sel+(e.deltaY>0?1:-1))));
},{passive:false});
$('#crown').addEventListener('pointerdown',()=>{if(busy)return;isHold(sel)?startHold(rows()[sel]):choose(sel)});
$('#act').addEventListener('click',()=>answer('n'));

/* fit to viewport */
function fit(){
  stage.style.transform='none';
  const s=Math.min(1,(innerHeight-120)/stage.offsetHeight,(innerWidth-60)/stage.offsetWidth);
  stage.style.transform=`scale(${s})`;
}
addEventListener('resize',fit);
fit();ask(true);
</script>
</body>
</html>
