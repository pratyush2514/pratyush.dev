<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#07080b;--fg:#e6e8ee;--mute:#6f7584;--line:#1a1e27;--l0:#151921;--l1:#0e4429;--l2:#006d32;--l3:#26a641;--l4:#39d353}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 50% -10%,#11141b,var(--bg));color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
.card{padding:26px 28px 22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(#0d0f14,#0a0c10);box-shadow:0 30px 80px -30px #000,inset 0 1px 0 #ffffff08}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.head b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.yrs{display:flex;gap:2px;background:#11141a;border:1px solid var(--line);border-radius:8px;padding:2px}.yrs button{all:unset;cursor:pointer;padding:4px 10px;border-radius:6px;color:var(--mute);font-size:12px;transition:.25s}.yrs .on{background:#1d212b;color:var(--fg)}
.months{position:relative;height:16px;margin-left:34px;font-size:11px;color:#a7adbb}.months span{position:absolute}
.wrap{display:grid;grid-template-columns:28px auto;gap:6px}
.days{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font-size:10px;color:var(--mute)}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px}
.c{border-radius:2.5px;background:var(--l0);box-shadow:inset 0 0 0 1px #ffffff07;transition:background-color .7s cubic-bezier(.22,1,.36,1) var(--d),transform .5s cubic-bezier(.34,1.56,.64,1) var(--d),opacity .3s,filter .3s}
.pulse .c{transform:scale(.55)}
.c.e{opacity:.0}
.l1{background:var(--l1)}.l2{background:var(--l2)}.l3{background:var(--l3)}.l4{background:var(--l4)}
.l4{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--l4) 35%,transparent))}
.grid:hover .c{transition-delay:0s}.c:hover{transform:scale(1.3);box-shadow:inset 0 0 0 1px #ffffff70;z-index:2}
.grid[data-f] .c{opacity:.15}.grid[data-f="0"] .l0,.grid[data-f="1"] .l1:not(.l0),.grid[data-f="2"] .l2,.grid[data-f="3"] .l3,.grid[data-f="4"] .l4{opacity:1}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mute);font-size:11px}
.legend{display:flex;gap:3px;align-items:center}.legend i{width:11px;height:11px;border-radius:2.5px;cursor:pointer;transition:background-color .7s,transform .2s}.legend i:hover{transform:scale(1.25)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:20px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{padding:10px 14px;border-right:1px solid var(--line)}.stats div:last-child{border:0}.stats small{display:block;color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}.stats b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.pal{margin-top:20px}.pal h4{display:flex;justify-content:space-between;margin:0 0 10px;font-weight:500;font-size:10.5px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw button{all:unset;cursor:pointer;padding:8px;border-radius:9px;border:1px solid var(--line);transition:border-color .25s,background .25s,transform .25s}
.sw button:hover{background:#12151c;transform:translateY(-1px)}.sw button.on{border-color:#4a5060;background:#141820}
.sw .r{display:flex;gap:2px;margin-bottom:6px}.sw .r i{flex:1;height:9px;border-radius:2px}.sw small{color:var(--mute);font-size:11px}.sw .on small{color:var(--fg)}
.hue{position:relative;height:22px;margin-top:10px;border-radius:7px;cursor:crosshair;background:linear-gradient(90deg,oklch(.72 .14 0),oklch(.72 .14 60),oklch(.72 .14 120),oklch(.72 .14 180),oklch(.72 .14 240),oklch(.72 .14 300),oklch(.72 .14 360));opacity:.85}
.hue b{position:absolute;top:-3px;width:6px;height:28px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px #0008;display:none}
.ball{position:fixed;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;pointer-events:none;z-index:9}.ring{position:fixed;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid;pointer-events:none;z-index:8}
#tip{position:fixed;pointer-events:none;background:#f2f3f6;color:#0a0b0f;padding:5px 9px;border-radius:7px;font-size:11px;opacity:0;transform:translate(-50%,4px);transition:opacity .15s,transform .2s;white-space:nowrap}#tip.v{opacity:1;transform:translate(-50%,0)}#tip b{font-weight:600}
</style></head><body><div class="card">
<div class="head"><b><span id="tot"></span> contributions in <span id="yl"></span></b><div class="yrs" id="y"></div></div>
<div class="months" id="m"></div>
<div class="wrap"><div class="days"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div><div class="grid" id="g"></div></div>
<div class="foot"><span id="pn"></span><div class="legend" id="lg">Less <i data-l="0" style="background:var(--l0)"></i><i data-l="1" style="background:var(--l1)"></i><i data-l="2" style="background:var(--l2)"></i><i data-l="3" style="background:var(--l3)"></i><i data-l="4" style="background:var(--l4)"></i> More</div></div>
<div class="stats"><div><small>Longest streak</small><b id="s1"></b></div><div><small>Current streak</small><b id="s2"></b></div><div><small>Busiest day</small><b id="s3"></b></div><div><small>Active days</small><b id="s4"></b></div></div>
<div class="pal"><h4><span>Palette</span><span>or pick a hue</span></h4><div class="sw" id="s"></div><div class="hue" id="hu"><b id="hk"></b></div></div></div><div id="tip"></div>
<script>
const P={"GitHub":["#0e4429","#006d32","#26a641","#39d353"],"Halloween":["#6b3a12","#c0682b","#f0a35a","#ffd76a"],"Celadon":["#1d3b36","#2f6b5e","#5fa68f","#a8dcc6"],"Wisteria":["#2a2440","#4b3f7a","#8572c4","#c9b8f5"],"Ember":["#3a1a14","#7a2e1c","#c8552b","#ffb27a"],"Glacier":["#14283a","#1f4f78","#3d8fd1","#a6dcff"],"Sakura":["#3a1e2a","#7a3456","#d06a98","#ffc2da"],"Matcha":["#262d18","#4c5c26","#8ea544","#d4e79a"],"Saffron":["#352a10","#7a5a12","#d19a1c","#ffd76a"],"Nocturne":["#1a1d26","#33394a","#6b7591","#c4cbe0"],"Coral Reef":["#3a1a1e","#8a3a3e","#e5736a","#ffc7a8"],"Aurora":["#123a3a","#1f7a6b","#5fd0a0","#d6f5a0"]};
const g=document.getElementById('g'),r=document.documentElement,M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],D=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const now=new Date().getFullYear(),Y=[now,now-1,now-2];
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function build(yr,ox,oy){const R=rng(yr*7+3);g.innerHTML='';m.innerHTML='';const st=new Date(yr,0,1),end=new Date(yr,11,31),today=new Date();
const pad=st.getDay();let t=0,run=0,best=0,cur=0,act=0,mx=0,mxd='',lm=-1,mood=.5,vac=0,arr=[];
for(let i=0;i<pad;i++){const c=document.createElement('div');c.className='c e';g.appendChild(c)}
for(let x=new Date(st);x<=end;x.setDate(x.getDate()+1)){const i=pad+Math.round((x-st)/864e5),w=i/7|0,dw=x.getDay();
if(x.getDate()<8&&dw==0||x.getDate()==1&&w==0){if(x.getMonth()!=lm){lm=x.getMonth();const s=document.createElement('span');s.textContent=M[lm];s.style.left=w*14+'px';m.appendChild(s)}}
mood+=(R()-.5)*.25;mood=Math.max(.05,Math.min(1,mood*.97+.5*.03));if(!vac&&R()<.012)vac=4+R()*10|0;
const fut=x>today;let n=0;if(!fut&&!vac){const wk=dw==0||dw==6?.35:1,p=mood*wk;if(R()<p*1.1)n=Math.max(1,Math.round(Math.pow(R(),2.2)*22*p))}if(vac)vac--;
t+=n;if(n){act++;run++;best=Math.max(best,run)}else if(!fut)run=0;if(!fut)cur=run;if(n>mx){mx=n;mxd=M[x.getMonth()]+' '+x.getDate()}
const l=n==0?0:n<3?1:n<7?2:n<12?3:4,c=document.createElement('div');c.className='c l'+l;
const dist=Math.hypot(w-ox,dw-oy);c.style.setProperty('--d',(dist*16)+'ms');c.dataset.w=w;c.dataset.d=dw;
c.dataset.t='<b>'+(n||'No')+' contribution'+(n==1?'':'s')+'</b> on '+D[dw]+', '+M[x.getMonth()]+' '+x.getDate()+(fut?' · upcoming':'');g.appendChild(c)}
tot.textContent=t.toLocaleString();yl.textContent=yr;s1.textContent=best+' days';s2.textContent=cur+' days';s3.textContent=mx+' · '+mxd;s4.textContent=act}
function ripple(ox,oy){g.querySelectorAll('.c').forEach(c=>c.style.setProperty('--d',Math.hypot(c.dataset.w-ox,c.dataset.d-oy)*16+'ms'));g.classList.add('pulse');requestAnimationFrame(()=>requestAnimationFrame(()=>g.classList.remove('pulse')))}
function apply(cols,name){cols.forEach((c,i)=>r.style.setProperty('--l'+(i+1),c));pn.textContent=name}
let busy=0;function fly(sx,sy,cols,name){busy++;const gr=g.getBoundingClientRect(),w=10+Math.random()*32|0,d=1+Math.random()*5|0,ex=gr.left+w*14+5,ey=gr.top+d*14+5,cx=(sx+ex)/2,cy=Math.min(sy,ey)-140;
const b=document.createElement('div');b.className='ball';b.style.background=`radial-gradient(circle at 35% 30%,${cols[3]},${cols[1]} 70%)`;b.style.boxShadow=`0 0 18px ${cols[2]}`;document.body.appendChild(b);
const k=[];for(let i=0;i<=24;i++){const t=i/24,x=(1-t)*(1-t)*sx+2*(1-t)*t*cx+t*t*ex,y=(1-t)*(1-t)*sy+2*(1-t)*t*cy+t*t*ey,s=i==0?0:i<3?1.4:1-t*.45;k.push({transform:`translate(${x}px,${y}px) scale(${s})`})}
b.animate(k,{duration:780,easing:'cubic-bezier(.45,0,.4,1)'}).onfinish=()=>{b.animate([{transform:`translate(${ex}px,${ey}px) scale(.55,.55)`},{transform:`translate(${ex}px,${ey+2}px) scale(.9,.3)`,opacity:1},{transform:`translate(${ex}px,${ey}px) scale(0)`,opacity:0}],{duration:220,easing:'ease-out'}).onfinish=()=>b.remove();
const rg=document.createElement('div');rg.className='ring';rg.style.left=ex+'px';rg.style.top=ey+'px';rg.style.borderColor=cols[3];document.body.appendChild(rg);rg.animate([{transform:'scale(1)',opacity:.9},{transform:'scale(9)',opacity:0}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>rg.remove();
ripple(w,d);apply(cols,name);busy--}}
function setP(k,b){const r=b.getBoundingClientRect();b.animate([{transform:'scale(1)'},{transform:'scale(.92)'},{transform:'scale(1)'}],{duration:300,easing:'cubic-bezier(.34,1.56,.64,1)'});fly(r.left+r.width/2,r.top+12,P[k],k);hk.style.display='none';document.querySelectorAll('.sw button').forEach(x=>x.classList.toggle('on',x==b))}
for(const k in P){const b=document.createElement('button');b.innerHTML='<div class="r">'+P[k].map(c=>'<i style="background:'+c+'"></i>').join('')+'</div><small>'+k+'</small>';b.onclick=()=>setP(k,b);s.appendChild(b)}
hu.onclick=e=>{const f=(e.clientX-hu.getBoundingClientRect().left)/hu.offsetWidth,h=Math.round(f*360);hk.style.display='block';hk.style.left=f*100+'%';fly(e.clientX,e.clientY,[`oklch(.32 .06 ${h})`,`oklch(.47 .10 ${h})`,`oklch(.64 .14 ${h})`,`oklch(.84 .12 ${h})`],'Custom · hue '+h+'°');document.querySelectorAll('.sw button').forEach(x=>x.classList.remove('on'))};
Y.forEach((yr,i)=>{const b=document.createElement('button');b.textContent=yr;b.onclick=()=>{document.querySelectorAll('.yrs button').forEach(x=>x.classList.toggle('on',x==b));g.classList.add('pulse');build(yr,0,3);requestAnimationFrame(()=>requestAnimationFrame(()=>g.classList.remove('pulse')))};y.appendChild(b);if(!i)b.classList.add('on')});
g.onmousemove=e=>{const c=e.target.dataset.t;tip.classList.toggle('v',!!c);if(c){const b=e.target.getBoundingClientRect();tip.innerHTML=c;tip.style.left=b.left+b.width/2+'px';tip.style.top=b.top-30+'px'}};g.onmouseleave=()=>tip.classList.remove('v');
g.onclick=e=>{if(e.target.dataset.w)ripple(+e.target.dataset.w,+e.target.dataset.d)};
lg.onmouseover=e=>{if(e.target.dataset.l)g.dataset.f=e.target.dataset.l};lg.onmouseleave=()=>delete g.dataset.f;
build(now,0,3);apply(P.GitHub,'GitHub');void busy;s.firstChild.classList.add('on');
</script></body></html>
